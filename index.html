<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

</head>
<body>
<title>Catatan Haid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Pencatat haid, nifas dan istihadhah menurut mazhab Syafi'i">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: satu kolom seperti buku saku, tab bawah di ponsel; linimasa darah sebagai pita 24 jam. */
:root {
  --bg: #f6f4f8;
  --surface: #ffffff;
  --surface-2: #efebf3;
  --ink: #231d2a;
  --muted: #6c6375;
  --line: #e2dce8;
  --accent: #7a2e55;
  --accent-ink: #ffffff;
  --haid: #a3213f;
  --haid-soft: #f7dfe5;
  --suci: #1f7a68;
  --suci-soft: #d9efe9;
  --ist: #a8701a;
  --ist-soft: #f6ead3;
  --nifas: #5b45a3;
  --nifas-soft: #e5dff5;
  --warn: #b5471b;
  --muta: #3f6491;
  --muta-soft: #dde7f3;
  --focus: #7a2e55;
  --shadow: 0 1px 2px rgba(35, 29, 42, .06), 0 6px 20px rgba(35, 29, 42, .06);
  --font-display: "Spectral", "Georgia", "Times New Roman", serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "IBM Plex Mono", "Consolas", ui-monospace, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17131b; --surface: #211b27; --surface-2: #2a2331; --ink: #f1ecf4; --muted: #b0a6b9; --line: #3a3142;
    --accent: #e08ab3; --accent-ink: #1d1220; --haid: #f0708c; --haid-soft: #46202b; --suci: #5cc8b0; --suci-soft: #17362f;
    --ist: #e3ae55; --ist-soft: #3d2f16; --nifas: #a996ec; --nifas-soft: #2e2747; --warn: #f08a5d; --focus: #e08ab3;
    --muta: #8fb3e3; --muta-soft: #1c2a3d;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17131b; --surface: #211b27; --surface-2: #2a2331; --ink: #f1ecf4; --muted: #b0a6b9; --line: #3a3142;
  --accent: #e08ab3; --accent-ink: #1d1220; --haid: #f0708c; --haid-soft: #46202b; --suci: #5cc8b0; --suci-soft: #17362f;
  --ist: #e3ae55; --ist-soft: #3d2f16; --nifas: #a996ec; --nifas-soft: #2e2747; --warn: #f08a5d; --focus: #e08ab3;
  --muta: #8fb3e3; --muta-soft: #1c2a3d;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.app { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(84px + env(safe-area-inset-bottom, 0px)); }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-block: 18px 10px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; letter-spacing: -.01em; margin: 0; }
.brand small { display: block; font-family: var(--font-body); font-weight: 500; font-size: .78rem; color: var(--muted); letter-spacing: .02em; }
.sync { font-size: .78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync[data-s="db"] i { background: var(--suci); }
.sync[data-s="local"] i { background: var(--ist); }
h2 { font-family: var(--font-display); font-size: 1.2rem; font-weight: 600; margin: 0; text-wrap: balance; }
h3 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; margin: 0; }
.stack { display: grid; gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: grid; gap: 10px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.mono, .num { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: .9em; }
.banner { background: var(--ist-soft); border: 1px solid color-mix(in srgb, var(--ist) 35%, transparent); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.banner p { margin: 0; flex: 1 1 240px; }

/* Status */
.status { border-radius: 18px; padding: 20px; display: grid; gap: 8px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.status::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 6px; background: var(--tone, var(--suci)); }
.status[data-t="haid"] { --tone: var(--haid); background: var(--haid-soft); }
.status[data-t="nifas"] { --tone: var(--nifas); background: var(--nifas-soft); }
.status[data-t="istihadhah"] { --tone: var(--ist); background: var(--ist-soft); }
.status[data-t="suci"] { --tone: var(--suci); background: var(--suci-soft); }
.status[data-t="naqa"] { --tone: var(--suci); background: var(--suci-soft); }
.status[data-t="mutahayyirah"] { --tone: var(--muta); background: var(--muta-soft); }
.status[data-t="mutahayyirah"] .label { font-size: 1.7rem; }
.pill[data-t="mutahayyirah"] { background: var(--muta-soft); color: var(--muta); }
.t-mutahayyirah { background: var(--muta); }
.law-item .dot.t-mutahayyirah { background: var(--muta); }
.status .label { font-family: var(--font-display); font-size: 2.1rem; line-height: 1.1; font-weight: 700; color: var(--tone); }
.status .since { font-size: .95rem; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: .75rem; font-weight: 600; letter-spacing: .02em; background: var(--surface-2); color: var(--ink); white-space: nowrap; }
.pill[data-t="haid"] { background: var(--haid-soft); color: var(--haid); }
.pill[data-t="nifas"] { background: var(--nifas-soft); color: var(--nifas); }
.pill[data-t="istihadhah"] { background: var(--ist-soft); color: var(--ist); }
.pill[data-t="naqa"], .pill[data-t="suci"] { background: var(--suci-soft); color: var(--suci); }
.pill[data-t="mandi"] { background: var(--surface-2); color: var(--accent); }
.pill[data-t="shalat"], .pill[data-t="qadha"] { background: var(--surface-2); color: var(--ink); }
.pill.prov { background: transparent; border: 1px dashed currentColor; color: var(--muted); }
ul.rules { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.todo { display: grid; gap: 8px; }
.todo .row { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.todo .when { font-family: var(--font-data); font-size: .8rem; color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.kv div { display: grid; gap: 2px; min-width: 0; }
.kv b { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }
.quick { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.quick label { display: grid; gap: 4px; font-size: .8rem; color: var(--muted); flex: 1 1 200px; }

/* Buttons & forms */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.blood { background: var(--haid); border-color: var(--haid); color: #fff; }
.btn.clean { background: var(--suci); border-color: var(--suci); color: #fff; }
:root[data-theme="dark"] .btn.blood, :root[data-theme="dark"] .btn.clean { color: #120c15; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.blood, :root:not([data-theme="light"]) .btn.clean { color: #120c15; } }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--warn); }
.btn.sm { padding: 5px 10px; font-size: .82rem; border-radius: 8px; }
.dtp { display: grid; gap: 6px; }
.dtp-row { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 8px; }
.dtp .chips .chip { padding: 6px 11px; }
.dtp-note { margin: 0; }
.pred-list { display: grid; gap: 6px; }
.pred-item { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 9px 12px; border: 1px dashed var(--haid); border-radius: 10px; }
.t-pred { background: repeating-linear-gradient(135deg, var(--haid-soft) 0 3px, transparent 3px 6px); outline: 1px dashed var(--haid); outline-offset: -1px; }
.day-acts { display: flex; gap: 8px; flex-wrap: wrap; }
input[type="date"], input[type="time"], input[type="datetime-local"], input[type="number"], input[type="text"], select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; min-width: 0; }
textarea { font-family: var(--font-data); font-size: .8rem; min-height: 120px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: .8rem; color: var(--muted); font-weight: 500; }
.check { display: flex; gap: 8px; align-items: center; font-size: .9rem; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.err { color: var(--warn); font-size: .85rem; margin: 0; }

/* Catatan */
.entries { display: grid; gap: 8px; }
.entry { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.entry .t { font-weight: 600; }
.entry .d { font-size: .85rem; color: var(--muted); }
.entry .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.empty { padding: 22px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 12px; }

/* Kalender */
.cal-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dow { font-size: .72rem; color: var(--muted); text-align: center; font-weight: 600; letter-spacing: .04em; padding-bottom: 2px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; min-height: 58px; padding: 5px 5px 6px; display: grid; grid-template-rows: auto 1fr auto; gap: 3px; cursor: pointer; text-align: left; min-width: 0; }
.day.out { opacity: .45; }
.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.day.sel { background: var(--surface-2); }
.day.pred { border-style: dashed; border-color: var(--haid); }
.day .n { font-family: var(--font-data); font-size: .78rem; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); position: relative; overflow: hidden; }
.bar span { position: absolute; top: 0; bottom: 0; }
.t-haid { background: var(--haid); }
.t-nifas { background: var(--nifas); }
.t-istihadhah { background: var(--ist); }
.t-naqa { background: repeating-linear-gradient(135deg, var(--haid) 0 2px, transparent 2px 5px); }
.marks { display: flex; gap: 3px; min-height: 8px; }
.marks i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); display: block; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 8px; border-radius: 3px; display: inline-block; }
.daybar24 { height: 14px; border-radius: 6px; background: var(--surface-2); position: relative; overflow: hidden; }
.daybar24 span { position: absolute; top: 0; bottom: 0; }
.ticks { display: flex; justify-content: space-between; font-family: var(--font-data); font-size: .7rem; color: var(--muted); }

/* Hukum */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: .82rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.law { display: grid; gap: 0; }
.law-item { display: grid; grid-template-columns: 18px 1fr; gap: 10px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.law-item:last-child { border-bottom: 0; }
.law-item .dot { width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; background: var(--muted); }
.law-item .dot.t-naqa { background: var(--suci); }
.law-item .dot.t-haid { background: var(--haid); }
.law-item .dot.t-nifas { background: var(--nifas); }
.law-item .dot.t-istihadhah { background: var(--ist); }
.law-item .dot.ev { background: transparent; border: 2px solid var(--accent); }
.law-item .body { display: grid; gap: 5px; min-width: 0; }
.law-item .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.law-item .range { font-family: var(--font-data); font-size: .82rem; }
.law-item p { margin: 0; }
.ref { font-size: .78rem; color: var(--muted); border-left: 2px solid var(--line); padding-left: 8px; }

/* Panduan */
details.guide { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
details.guide summary { cursor: pointer; font-weight: 600; }
details.guide[open] summary { margin-bottom: 8px; }
.bait { font-family: var(--font-display); font-style: italic; color: var(--muted); margin: 6px 0 0; padding-left: 10px; border-left: 2px solid var(--haid-soft); white-space: pre-line; }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); z-index: 5; }
.tabs .in { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 760px; }
.tab { background: none; border: 0; padding: 9px 2px 10px; font-size: .74rem; font-weight: 600; color: var(--muted); display: grid; justify-items: center; gap: 3px; cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { color: var(--accent); }

/* Sheet */
.sheet-wrap { position: fixed; inset: 0; background: rgba(20, 14, 24, .45); display: grid; align-items: end; justify-items: center; z-index: 20; padding-top: env(safe-area-inset-top, 0px); }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; max-height: 92vh; overflow: auto; }
@media (min-width: 640px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 18px; } }
.sheet .acts { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: .88rem; z-index: 30; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .view { animation: fade .18s ease-out; } @keyframes fade { from { opacity: .4; transform: translateY(4px); } to { opacity: 1; transform: none; } } }
@media (min-width: 900px) { .app { padding-block: 0 96px; } }
</style>

<div class="app">
  <header class="top">
    <h1 class="brand">Catatan Haid<small>Haid · Nifas · Istihadhah — mazhab Syafi'i</small></h1>
    <div class="sync" id="sync" data-s="wait"><i></i><span>Memuat catatan…</span></div>
  </header>

  <div class="banner" id="demoBanner" hidden>
    <p><b>Ini data contoh.</b> Isinya bukan catatan Anda, hanya untuk memperlihatkan cara kerja aplikasi. Catatan pertama yang Anda tambahkan akan menggantikan contoh ini.</p>
    <button class="btn primary sm" id="demoClear" type="button">Mulai mencatat</button>
  </div>

  <main>
    <section class="view stack" id="v-hariini" aria-label="Hari ini"></section>
    <section class="view stack" id="v-catatan" aria-label="Catatan" hidden></section>
    <section class="view stack" id="v-kalender" aria-label="Kalender" hidden></section>
    <section class="view stack" id="v-hukum" aria-label="Riwayat hukum" hidden></section>
    <section class="view stack" id="v-lainnya" aria-label="Lainnya" hidden></section>
  </main>
</div>

<nav class="tabs" aria-label="Menu utama">
  <div class="in" role="tablist">
    <button class="tab" role="tab" data-v="hariini" aria-selected="true" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3.5 4.2 6 7.6 6 10.6A6 6 0 0 1 6 13.6C6 10.6 8.5 7.2 12 3z"/></svg>Hari ini</button>
    <button class="tab" role="tab" data-v="catatan" aria-selected="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M9 10h6M9 14h6M9 18h3"/></svg>Catatan</button>
    <button class="tab" role="tab" data-v="kalender" aria-selected="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Kalender</button>
    <button class="tab" role="tab" data-v="hukum" aria-selected="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6.5 4 9.5 4 12 5.5v14C9.5 18 6.5 18 4 19.5zM20 5.5C17.5 4 14.5 4 12 5.5v14c2.5-1.5 5.5-1.5 8 0z"/></svg>Hukum</button>
    <button class="tab" role="tab" data-v="lainnya" aria-selected="false" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>Lainnya</button>
  </div>
</nav>

<script>/* Mesin hukum haid, nifas dan istihadhah (qaul tsani, mazhab Syafi'i).
 * Rujukan: "Dan Mereka Bertanya Kepadamu Tentang Haid" (Nur Hasyim S. Anam)
 * Edisi 2017, Jilid 1-3, dan "Bait-Bait Haid".
 * Semua waktu dalam milidetik (epoch). Fungsi murni: analyze(data, now).
 */
(function (root) {
  const MIN = 60e3, H = 60 * MIN, D = 24 * H, F = 15 * D, N60 = 60 * D;

  const REF = {
    masaHaid: { src: 'DMBK Edisi 2017, Bab Haid D (Masa Haid); Jilid 1 Bab E', bait: '14-17' },
    bersih24: { src: 'Jilid 1 Bab E (bersih setelah 24 jam, pendapat mu\'tamad)', bait: '18-21' },
    naqa: { src: 'DMBK Bab Haid D (qaul sahbi & laqthi)', bait: '26-27' },
    penyempurna: { src: 'DMBK Bab Haid F; Jilid 1 Bab G (konsep menyempurnakan suci)', bait: '34-37' },
    lanjutan: { src: 'Jilid 1 Bab G (darah kedua dalam 15 hari)', bait: '38-41' },
    istihadhah: { src: 'DMBK Bab Haid G; Jilid 1 Bab I (kembali ke haid & suci terakhir)', bait: '42-44, 112-115' },
    urutan: { src: 'DMBK Bab Haid G (adat beraturan, minimal berulang dua kali)', bait: '113-115' },
    mandiMustahadhah: { src: 'DMBK Bab Haid H (waktu mandi mustahadhah)', bait: '45-46' },
    pindahAdat: { src: 'Jilid 3 Bab D (tidak ada darah di masa adat)', bait: 'Lagu Kaidah: "Tak ada darah saat adatnya..."' },
    sebagianAdat: { src: 'Jilid 3 Bab D (darah hanya sebagian masa adat)', bait: '-' },
    perubahanSiklus: { src: 'Jilid 3 Bab C (perubahan siklus)', bait: '-' },
    pemula: { src: 'DMBK Bab Mustahadhah E; Jilid 3 Bab A (pemula hanya siklus pertama)', bait: '103' },
    fasad: { src: 'DMBK Bab Haid D (darah kurang dari 24 jam bukan haid)', bait: '16-18' },
    nifas: { src: 'DMBK Bab Nifas A-B', bait: '50-53' },
    nifasLebih: { src: 'DMBK Bab Nifas D pendapat ke-2', bait: '61-63' },
    nifasHaid: { src: 'DMBK Bab Nifas B-C (jarak 15 hari setelah melahirkan)', bait: '53, 56-60' },
    mutahayyirah: { src: 'Jilid 2 Bab I (lupa kebiasaan haid) dan Bab J (hukum mutahayyirah); DMBK Bab Mustahadhah H-I', bait: '119-135' },
  };

  function predict(list) {
    const n = list.length;
    if (!n) return null;
    for (let p = 2; p <= Math.floor(n / 2); p++) {
      let ok = true;
      for (let i = 0; i < p; i++) {
        if (Math.abs(list[n - 2 * p + i] - list[n - p + i]) >= MIN) { ok = false; break; }
      }
      if (ok) {
        const seq = list.slice(n - p);
        if (seq.some(v => Math.abs(v - seq[0]) >= MIN)) return { value: list[n - p], pattern: seq };
      }
    }
    return { value: list[n - 1], pattern: null };
  }

  function analyze(data, now) {
    now = now == null ? Date.now() : now;
    const lupaAdat = !!(data.settings && data.settings.lupaAdat);
    const births = (data.births || []).map(b => ({ t: +b.time, kind: b.kind || 'lahir', id: b.id }))
      .filter(b => isFinite(b.t) && b.t <= now).sort((a, b) => a.t - b.t);

    // 1. Normalisasi darah: urutkan, gabungkan yang bertumpuk, potong di waktu melahirkan.
    let raw = (data.bloods || []).map(b => ({ s: +b.start, e: b.end == null ? now : +b.end, open: b.end == null }))
      .filter(b => isFinite(b.s) && b.s <= now && b.e > b.s).sort((a, b) => a.s - b.s);
    const merged = [];
    for (const b of raw) {
      const last = merged[merged.length - 1];
      if (last && b.s <= last.e) { if (b.e >= last.e) { last.e = b.e; last.open = b.open; } }
      else merged.push({ ...b });
    }
    let bl = [];
    for (const b of merged) {
      let cur = { ...b };
      for (const br of births) {
        if (br.t > cur.s && br.t < cur.e) { bl.push({ s: cur.s, e: br.t, open: false }); cur = { s: br.t, e: cur.e, open: cur.open }; }
      }
      bl.push(cur);
    }

    const bloodIn = (a, b) => { let t = 0; for (const x of bl) { const s = Math.max(a, x.s), e = Math.min(b, x.e); if (e > s) t += e - s; } return t; };
    const firstBloodAtOrAfter = (t, limit = Infinity) => { for (const x of bl) { if (x.e > t && x.s < limit) return Math.max(t, x.s); } return null; };
    const lastBloodPointIn = (a, b) => { let r = null; for (const x of bl) { const s = Math.max(a, x.s), e = Math.min(b, x.e); if (e > s) r = e; } return r; };
    const lastBloodEndBefore = (t, after) => { let r = null; for (const x of bl) { const e = Math.min(x.e, t); if (e > after && x.s < t) r = e; } return r; };
    const isOpenAt = t => bl.some(x => x.open && x.s <= t && x.e >= t);
    const nextBirthAfter = t => { for (const b of births) if (b.t > t) return b; return null; };
    const blockStarts = (a, b) => bl.filter(x => x.s >= a && x.s < b).map(x => x.s);

    // chain: interval darah mulai h yang dimulai sebelum h+F (dan sebelum batas melahirkan)
    function chainFrom(h, limit) {
      let end = h, open = false;
      for (const x of bl) {
        if (x.e <= h) continue;
        if (x.s >= Math.min(h + F, limit)) break;
        end = Math.max(end, Math.min(x.e, limit));
        if (x.open && x.e > h) open = true;
      }
      return { end, open };
    }

    const periods = [];   // haid & nifas: {type,start,end,provisional,reason,ref,notes[]}
    const istReasons = []; // {start,end,reason,ref}
    const events = [];     // {time,kind,text,ref}
    const hH = [], hS = [];
    let lastHaidEnd = null, lastHaidStart = null, purityRef = null, skipSuci = false;
    let mode = null;       // keterangan mustahadhah yang sedang berjalan
    let cursor = -Infinity;
    let usedBirth = -Infinity;
    let guard = 0;

    const addPeriod = (p) => { periods.push(p); return p; };
    const addIst = (s, e, reason, ref) => { if (e > s) istReasons.push({ start: s, end: e, reason, ref }); };
    const ev = (time, kind, text, ref) => events.push({ time, kind, text, ref });

    function pushSuci(v) { if (v != null && v > 0) hS.push(v); }

    // ---------------- Mode mustahadhah ----------------
    function runMode(st) {
      // st: {X, first, prevHaidEnd, pendingSuci, mustStart, limit}
      let { X, first, prevHaidEnd, pendingSuci, mustStart } = st;
      const limitBirth = nextBirthAfter(Math.max(X - 1, prevHaidEnd || X - 1));
      const limit = limitBirth ? limitBirth.t : Infinity;
      let cyc = 0;
      while (guard++ < 5000) {
        const pH = predict(hH);
        const aH = pH ? pH.value : D;
        const patternNote = pH && pH.pattern ? ' (mengikuti urutan adat yang berulang)' : '';
        if (X >= limit || X > now) { mode = { X, aH, prevHaidEnd, mustStart, waiting: X > now }; return { stop: X > now ? 'future' : 'birth', at: Math.min(limit, cursorEnd()) }; }

        // C1: bersih >= 15 hari setelah haid terakhir -> mustahadhah selesai, siklus baru
        const c1 = cleanGapF(first || prevHaidEnd == null ? mustStart : Math.max(prevHaidEnd, mustStart), X + aH);
        if (c1 != null) { addIstBetween(prevHaidEnd, c1.gapStart, first ? mustStart : null); return { stop: 'c1', at: c1.next }; }

        const W0 = X, W1 = Math.min(X + aH, limit);
        const bIn = bloodIn(W0, W1);
        let hStart = null, hEnd = null, shifted = null;

        if (bIn >= D) {
          hStart = firstBloodAtOrAfter(W0, W1);
        } else {
          // tidak ada darah (cukup) di masa adat: pindah ke darah sebelum/sesudahnya
          let earlier = null, later = null;
          if (bIn === 0 && prevHaidEnd != null) {
            const E = lastBloodEndBefore(X, prevHaidEnd);
            if (E != null) {
              const hs = Math.max(E - aH, prevHaidEnd + F);
              if (hs < E && bloodIn(hs, E) >= D) earlier = { hs, E, dist: X + aH - E };
            }
          }
          const cands = [X, ...blockStarts(X, limit)];
          for (const t0 of cands) {
            const t = firstBloodAtOrAfter(t0, limit);
            if (t == null) break;
            // jangan melewati jeda bersih >= 15 hari
            const lb = lastBloodEndBefore(t, prevHaidEnd != null ? prevHaidEnd : mustStart);
            if (lb != null && t - lb >= F && t > X) break;
            if (bloodIn(t, Math.min(t + aH, limit)) >= D) { later = { t, dist: t - X }; break; }
          }
          // pindah ke darah sebelumnya hanya bila ada darah sesudahnya untuk dibandingkan
          if (earlier && later && earlier.dist < later.dist) {
            shifted = 'earlier';
            hStart = earlier.hs; hEnd = earlier.E;
          } else if (later) {
            shifted = 'later';
            hStart = later.t;
          } else {
            mode = { X, aH, prevHaidEnd, mustStart, waiting: true };
            addIstBetween(prevHaidEnd, Math.min(now, limit), first ? mustStart : null);
            return { stop: 'nodata', at: null };
          }
        }

        // C2: darah sejak awal haid berhenti sebelum 15 hari -> haid semua
        if (shifted !== 'earlier') {
          const ch = chainFrom(hStart, limit);
          const closed = !ch.open || now >= hStart + F;
          if (closed && ch.end <= hStart + F && !first) {
            addIstBetween(prevHaidEnd, hStart, null);
            const p = addPeriod({ type: 'haid', start: hStart, end: ch.end, provisional: false,
              reason: 'Pada siklus ini darah berhenti sebelum 15 hari sejak awal haid, maka semuanya haid (bukan lagi mustahadhah). Jumlahnya menjadi adat haid yang baru.',
              ref: REF.perubahanSiklus });
            const adatEnd = hStart + aH;
            if (adatEnd < ch.end) ev(adatEnd, 'mandi', 'Mandi setelah masa adat haid berakhir (karena masih mustahadhah).', REF.mandiMustahadhah);
            ev(ch.end, 'mandi', 'Mandi lagi saat darah benar-benar bersih. Darah ternyata tidak lebih dari 15 hari, maka semuanya haid. Puasa yang dikerjakan di antara dua mandi wajib diqadha.', REF.mandiMustahadhah);
            if (prevHaidEnd != null) pushSuci(hStart - prevHaidEnd);
            hH.push(ch.end - hStart);
            lastHaidStart = hStart; lastHaidEnd = ch.end; purityRef = ch.end;
            p.notes = ['Adat haid baru: ' + fmtDur(ch.end - hStart)];
            return { stop: 'c2', at: ch.end };
          }
        }

        if (hEnd == null) {
          const wEnd = Math.min(hStart + aH, limit);
          hEnd = shifted === 'later' ? (lastBloodPointIn(hStart, wEnd) || wEnd) : (lastBloodPointIn(W0, W1) || W1);
          // bila darah memenuhi seluruh masa adat, haid = masa adat penuh
          if (bloodIn(hStart, wEnd) >= wEnd - hStart - MIN) hEnd = wEnd;
        }

        // istihadhah di antara haid sebelumnya dan haid ini
        addIstBetween(prevHaidEnd, hStart, first ? mustStart : null);

        let reason, ref;
        if (first) {
          reason = !st.pemula
            ? 'Darah melebihi 15 hari 15 malam, maka haidnya disamakan dengan adat haid terakhir' + patternNote + ': ' + fmtDur(aH) + '. Selebihnya istihadhah.'
            : 'Mustahadhah pemula yang tidak dapat membedakan darah: haid sehari semalam (24 jam), suci 29 hari. Siklus ini menjadi adat untuk berikutnya. Jika sebenarnya Anda sudah pernah haid sebelum catatan pertama tetapi lupa adatnya, aktifkan pilihan "Sudah pernah haid tetapi lupa adat" di menu Lainnya, karena hukumnya berbeda (mutahayyirah).';
          ref = st.pemula ? REF.pemula : REF.istihadhah;
        } else if (shifted === 'earlier') {
          reason = 'Pada masa adat tidak ada darah. Darah sebelumnya lebih dekat daripada darah sesudahnya, maka haid pindah (maju) ke akhir darah sebelumnya' + (hEnd - hStart < aH - MIN ? ', terbatas karena suci minimal 15 hari' : '') + '. Adat suci berubah.';
          ref = REF.pindahAdat;
        } else if (shifted === 'later') {
          reason = 'Pada masa adat tidak ada darah (atau kurang dari 24 jam), maka haid pindah ke darah sesudahnya. Adat suci bertambah.';
          ref = REF.pindahAdat;
        } else if (hStart > W0 + MIN || hEnd < W1 - MIN) {
          reason = 'Mustahadhah: pada masa adat hanya sebagian yang ada darahnya, maka haidnya hanya darah yang keluar di masa adat. Siklus tidak berubah.';
          ref = REF.sebagianAdat;
        } else {
          reason = 'Mustahadhah: haid disamakan dengan adat haid' + patternNote + ' (' + fmtDur(aH) + '), lalu suci sesuai adat suci.';
          ref = REF.istihadhah;
        }
        const prov = hEnd > now || (first && now < mustStart + F);
        addPeriod({ type: 'haid', start: hStart, end: Math.min(hEnd, now), provisional: prov, reason, ref, mustahadhah: true });

        if (first) {
          ev(mustStart + F, 'mandi', 'Siklus pertama istihadhah: mandi setelah lewat 15 hari 15 malam sejak darah keluar.', REF.mandiMustahadhah);
          if (mustStart + F > hEnd) ev(mustStart + F, 'qadha-rentang', JSON.stringify({ from: hEnd, to: mustStart + F }), REF.mandiMustahadhah);
        } else if (shifted === 'earlier') {
          ev(hEnd, 'mandi', 'Haid pindah ke darah sebelumnya: wajib mandi saat menyadarinya, dan mengqadha ibadah (shalat/puasa) yang dikerjakan dalam masa itu.', REF.pindahAdat);
        } else {
          ev(hEnd, 'mandi', 'Mandi segera setelah masa adat haid selesai, lalu berlaku hukum istihadhah (wajib shalat).', REF.mandiMustahadhah);
        }

        // perbarui adat
        if (prevHaidEnd != null) {
          if (shifted) pushSuci(hStart - prevHaidEnd);
          else if (pendingSuci != null) pushSuci(pendingSuci);
          else pushSuci(hStart - prevHaidEnd);
        }
        hH.push(aH);
        lastHaidStart = hStart; lastHaidEnd = hEnd; purityRef = hEnd;
        const pS = predict(hS);
        const aS = pS ? pS.value : 29 * D;
        if (shifted === 'earlier') X = hEnd + aS;
        else if (shifted === 'later') X = hStart + aH + aS;
        else X = W0 + aH + aS;
        pendingSuci = aS;
        prevHaidEnd = hEnd;
        first = false; cyc++;
      }
      return { stop: 'guard', at: null };
    }

    function cursorEnd() { return bl.length ? bl[bl.length - 1].e : now; }

    // jeda bersih >= 15 hari setelah 'from' dan sebelum 'until'
    function cleanGapF(from, until) {
      if (from == null) return null;
      let prevEnd = from;
      for (const x of bl) {
        if (x.e <= from) continue;
        const s = Math.max(x.s, from);
        if (s - prevEnd >= F && prevEnd < until) return { gapStart: prevEnd, next: s };
        if (s >= until) break;
        prevEnd = Math.max(prevEnd, x.e);
      }
      return null;
    }

    function addIstBetween(a, b, firstStart) {
      if (a == null || b == null || b <= a) return;
      addIst(a, b, firstStart != null
        ? 'Darah setelah masa adat haid pada siklus pertama istihadhah: hukumnya istihadhah (suci). Shalat yang ditinggalkan wajib diqadha.'
        : 'Darah di luar masa adat haid: istihadhah (darah penyakit), hukumnya suci. Wajib shalat dan puasa seperti daimul hadats.', REF.istihadhah);
    }

    // ---------------- Proses normal ----------------
    let t = -Infinity;
    while (guard++ < 5000) {
      const p = firstBloodAtOrAfter(t);
      if (p == null) break;

      // melahirkan yang sudah dilewati: suci tidak harus 15 hari
      for (const b of births) if (b.t > usedBirth && b.t <= p) { usedBirth = b.t; purityRef = null; skipSuci = true; mode = null; }
      const lastBirth = births.filter(b => b.t <= p).pop();
      const nb = nextBirthAfter(p);
      const limit = nb ? nb.t : Infinity;

      // ---- NIFAS ----
      if (lastBirth && p - lastBirth.t < F && p < lastBirth.t + N60 && !lastBirth.done) {
        lastBirth.done = true;
        const b = lastBirth.t, cap = Math.min(b + N60, limit);
        let end = p, open = false, exceed = false, prevE = p;
        for (const x of bl) {
          if (x.e <= p) continue;
          if (x.s >= cap) break;
          if (x.s - prevE >= F) break; // putus 15 hari: sesudahnya bukan nifas
          if (x.e > cap) { exceed = x.e > b + N60 && cap === b + N60; end = cap; open = x.open; prevE = cap; break; }
          end = x.e; open = x.open; prevE = x.e;
        }
        const finalN = !open || now >= b + N60;
        addPeriod({ type: 'nifas', start: p, end: Math.min(end, now), provisional: !finalN,
          reason: 'Darah setelah ' + (lastBirth.kind === 'keguguran' ? 'keguguran' : 'melahirkan') + ' (keluar kurang dari 15 hari setelahnya) adalah nifas. Paling lama 60 hari dihitung sejak melahirkan.',
          ref: REF.nifas });
        if (finalN && !exceed) ev(end, 'mandi', 'Mandi nifas (sekaligus mandi wiladah) setelah darah nifas bersih.', REF.nifas);
        purityRef = null; skipSuci = true;
        if (exceed) {
          ev(b + N60, 'mandi', 'Nifas sudah genap 60 hari: mandi, lalu berlaku hukum suci/istihadhah.', REF.nifasLebih);
          const pS = predict(hS);
          if (pS && hH.length) {
            const r = runMode({ X: b + N60 + pS.value, first: false, prevHaidEnd: b + N60, pendingSuci: pS.value, mustStart: b + N60 });
            if (r.at == null) break; t = r.at; continue;
          } else {
            const ch = (function () { let e = b + N60; for (const x of bl) { if (x.e <= e) continue; if (x.s > e + MIN) break; e = x.e; } return e; })();
            addIst(b + N60, ch, 'Darah melebihi 60 hari setelah melahirkan. Belum ada adat haid dan suci yang tercatat, maka sisanya dihukumi istihadhah. Kasus ini sebaiknya dikonsultasikan ke ustadzah.', REF.nifasLebih);
            t = ch; continue;
          }
        }
        t = end; continue;
      }

      // ---- HAID ----
      let h0 = p;
      if (purityRef != null && p < purityRef + F) {
        const until = Math.min(purityRef + F, limit);
        const istEnd = Math.min(until, chainSimple(p, until));
        addIst(p, istEnd, 'Darah keluar setelah 15 hari dari awal haid sebelumnya, tetapi masa sucinya belum genap 15 hari. Maka darah ini menjadi penyempurna suci (istihadhah) sampai suci genap 15 hari.', REF.penyempurna);
        const nxt = firstBloodAtOrAfter(until);
        if (nxt == null) break;
        if (nxt > until) { t = nxt; continue; }
        h0 = until;
      }

      const ch = chainFrom(h0, limit);
      const exceed = ch.end > h0 + F && bloodIn(h0 + F, ch.end) > 0;
      if (!exceed) {
        const total = bloodIn(h0, ch.end);
        const stillPossible = ch.open || now < h0 + F;
        if (total >= D || (ch.open && now < h0 + D)) {
          const p1 = addPeriod({ type: 'haid', start: h0, end: Math.min(ch.end, now), provisional: stillPossible,
            reason: total < D
              ? 'Darah baru keluar kurang dari 24 jam. Untuk sementara tinggalkan shalat. Jika berhenti sebelum genap 24 jam, darah ini bukan haid dan shalat yang ditinggalkan wajib diqadha.'
              : (bloodIn(h0, ch.end) < ch.end - h0 - MIN
                ? 'Darah putus-putus dalam 15 hari, namun jumlahnya mencapai 24 jam, maka dihukumi haid. Masa bersih di sela-selanya diperselisihkan (sahbi: haid, laqthi: suci).'
                : 'Darah keluar tidak kurang dari 24 jam dan tidak lebih dari 15 hari 15 malam, maka dihukumi haid.'),
            ref: total < D ? REF.fasad : REF.masaHaid, early: total < D });
          // mandi tiap kali bersih setelah darah mencapai 24 jam
          let cum = 0;
          for (const x of bl) {
            if (x.e <= h0 || x.s >= ch.end) continue;
            cum += Math.min(x.e, ch.end) - Math.max(x.s, h0);
            if (!x.open && x.e < ch.end) ev(x.e, cum >= D ? 'mandi' : 'info', cum >= D
              ? 'Darah berhenti setelah mencapai 24 jam: wajib mandi dan shalat (pendapat mu\'tamad). Jika darah keluar lagi sebelum hari ke-15, berlaku haid lagi.'
              : 'Darah berhenti sebelum 24 jam: wajib shalat (cukup bersuci, belum mandi haid). Jika darah keluar lagi dan jumlahnya mencapai 24 jam dalam 15 hari, semuanya haid.', cum >= D ? REF.bersih24 : REF.fasad);
          }
          if (!ch.open && total >= D) ev(ch.end, 'mandi', 'Darah bersih: wajib mandi haid lalu shalat.' + (now < h0 + F ? ' Jika darah keluar lagi sebelum genap 15 hari sejak awal haid, kembali berlaku haid.' : ''), REF.bersih24);
          if (lastHaidEnd != null && !skipSuci) pushSuci(h0 - lastHaidEnd);
          skipSuci = false;
          if (total >= D) hH.push(ch.end - h0);
          lastHaidStart = h0; lastHaidEnd = ch.end; purityRef = ch.end;
          p1.adatAfter = { haid: predict(hH), suci: predict(hS) };
        } else {
          addIst(h0, ch.end, 'Darah yang keluar dalam 15 hari jumlahnya tidak mencapai 24 jam, maka bukan haid (darah fasad/istihadhah). Shalat yang ditinggalkan selama darah keluar wajib diqadha.', REF.fasad);
          ev(ch.end, 'qadha-fasad', JSON.stringify({ from: h0, to: ch.end }), REF.fasad);
        }
        t = ch.end; continue;
      }

      // ---- MUSTAHADHAH ----
      const pemula = !hH.length;
      if (pemula && lupaAdat) {
        // Bukan pemula tetapi lupa adat (jumlah dan waktunya): mutahayyirah selama istihadhah berlangsung
        let end = h0, prevE = h0;
        for (const x of bl) {
          if (x.e <= h0) continue;
          if (x.s >= limit) break;
          if (x.s - prevE >= F) break; // bersih 15 hari: istihadhah selesai
          end = Math.min(x.e, limit); prevE = end;
        }
        addPeriod({ type: 'mutahayyirah', start: h0, end: Math.min(end, now), provisional: end >= now,
          reason: 'Darah melebihi 15 hari 15 malam, sedangkan Anda sudah pernah haid tetapi lupa adat haid (jumlah dan waktunya). Maka berlaku hukum mutahayyirah: hukum haid dalam segala hal, kecuali talak, membaca Al-Qur\'an dengan niat belajar, ibadah yang butuh niat (shalat, puasa, i\'tikaf), dan masuk masjid untuk ibadah. Hukum ini berlaku sampai darah bersih 15 hari.',
          ref: REF.mutahayyirah });
        ev(h0 + F, 'info', 'Darah melewati 15 hari 15 malam dan adat haid tidak diketahui: mulai sekarang berlaku hukum mutahayyirah. Wajib shalat setiap waktu dan qadha shalat 2 hari setiap bulan; suami haram menggauli. Shalat yang ditinggalkan selama 15 hari pertama sebaiknya ditanyakan kepada ustadzah.', REF.mutahayyirah);
        purityRef = null; skipSuci = true;
        t = end; continue;
      }
      if (lastHaidEnd != null && !skipSuci) { /* suci didorong di runMode */ }
      const r = runMode({ X: h0, first: true, prevHaidEnd: pemula ? null : (skipSuci ? null : lastHaidEnd), pendingSuci: (lastHaidEnd != null && !skipSuci) ? h0 - lastHaidEnd : null, mustStart: h0, pemula });
      skipSuci = false;
      if (r.at == null) break;
      t = r.at;
    }

    const s = obligationAtStart(p.start);
    if (s && !s.none) extra.push({ time: p.start, kind: 'shalat', text: s.text, ref: { src: 'Jilid 1 Bab Tentang Shalatnya B (datangnya penghalang)', bait: '75-76' } });
    // darah sudah berhenti (bukan sedang mengalir): kewajiban shalat saat suci
    if (p.end < R.now - MIN) {
      const o = obligationAtEnd(p.end);
      extra.push({ time: p.end, kind: 'shalat', text: o.text + (p.provisional ? ' Jika darah keluar lagi dalam 15 hari sejak awal haid, kembali berlaku haid.' : ''), ref: { src: 'Jilid 1 Bab Tentang Shalatnya C (berakhirnya penghalang)', bait: '77-78' } });
    }
  }
  const evs = [];
  for (const ev of R.events) {
    if (ev.kind === 'qadha-rentang' || ev.kind === 'qadha-fasad') {
      const r = JSON.parse(ev.text);
      const to = Math.min(r.to, R.now);
      // hanya saat darah keluar: di masa bersih ia sudah wajib shalat dan (seharusnya) sudah mengerjakannya
      const pieces = R.bloods.map(b => ({ s: Math.max(b.s, r.from), e: Math.min(b.e, to) })).filter(p => p.e > p.s);
      const list = prayersEndingIn(r.from, to).filter(w => pieces.some(p => w.e - MIN >= p.s && w.e - MIN < p.e));
      const head = ev.kind === 'qadha-fasad' ? 'Darah ini bukan haid. ' : 'Shalat yang ditinggalkan di luar masa haid (siklus pertama istihadhah). ';
      const ranges = pieces.map(p => fmtRange(p.s, p.e)).join('; ');
      evs.push({ time: r.to, kind: 'qadha', text: head + 'Qadha shalat yang ditinggalkan selama darah keluar: ' + ranges + (list.length ? ' — ' + countPrayers(list) + (r.to > R.now ? ' (sejauh ini)' : '') : '') + '. Shalat di hari-hari bersih tidak perlu diulang.', ref: ev.ref });
    } else evs.push(ev);
  }
  R.allEvents = evs.concat(extra).sort((a, b) => a.time - b.time);
}

function currentStatus() {
  const now = R.now;
  const tl = R.timeline;
  const open = R.bloods.find(b => b.open);
  let item = tl.find(x => x.type !== 'naqa' && x.start <= now && (x.end > now || (x.end >= now - MIN && open && open.e >= now - MIN && x.provisional)));
  const naqa = tl.find(x => x.type === 'naqa' && x.start <= now && x.end > now);
  if (naqa) item = naqa;
  if (item) return { t: item.type, item };
  // bersih setelah haid yang masih mungkin berlanjut
  const last = R.periods[R.periods.length - 1];
  if (last && last.type === 'haid' && last.provisional && now < last.start + F && now > last.end) return { t: 'naqa', item: { type: 'naqa', start: last.end, end: now, reason: 'Darah sudah bersih. Menurut pendapat mu\'tamad wajib mandi dan shalat. Jika darah keluar lagi sebelum ' + fmtDT(last.start + F) + ' (15 hari sejak awal haid), kembali berlaku haid.', ref: E.REF.bersih24, pending: true } };
  const lastBloodEnd = R.bloods.length ? R.bloods[R.bloods.length - 1].e : null;
  return { t: 'suci', item: { type: 'suci', start: R.lastHaid ? Math.max(R.lastHaid.end, lastBloodEnd || 0) : null } };
}

RULES.mutahayyirah = [

// ---------------- Render ----------------
function render() {
  analyze();
  renderHariIni(); renderCatatan(); renderKalender(); renderHukum(); renderLainnya();
}

function refHtml(ref) {
  if (!ref) return '';
  return '<div class="ref">Rujukan: ' + esc(ref.src) + (ref.bait && ref.bait !== '-' ? ' · Bait-Bait Haid ' + esc(ref.bait) : '') + '</div>';
}

function renderHariIni() {
  const el = document.getElementById('v-hariini');
  const st = currentStatus();
  const now = R.now;
  const open = R.bloods.find(b => b.open);
  const it = st.item;
  let since = '';
  if (it.start) {
    if (st.t === 'suci') since = 'Sejak ' + fmtDT(it.start);
    else since = 'Sejak ' + fmtDT(it.start) + ' · berjalan ' + fmtDur(now - it.start);
  } else since = 'Belum ada haid yang tercatat.';
  const provisional = it.provisional || it.pending;
  let h = '<div class="status" data-t="' + st.t + '">' +
    '<h3>Keadaan sekarang · ' + esc(fmtDT(now)) + '</h3>' +
    '<div class="label">' + LABEL[st.t] + (it.early ? ' (belum pasti)' : '') + '</div>' +
    '<div class="since">' + esc(since) + '</div>' +
    (provisional ? '<div><span class="pill prov">Sementara, bisa berubah sesuai darah berikutnya</span></div>' : '') +
    (it.reason ? '<p class="small" style="margin:0">' + esc(it.reason) + '</p>' + refHtml(it.ref) : '') +
    '</div>';

  // aksi cepat
  h += '<div class="card"><h3>' + (open ? 'Darah sedang keluar sejak ' + esc(fmtDT(open.s)) : 'Catat darah') + '</h3>' +
    (open
      ? '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn clean" id="qStopNow" type="button">Darah berhenti sekarang</button><button class="btn" id="qStopOther" type="button">Berhenti di waktu lain…</button></div>' +
        '<p class="small muted" style="margin:0">Pakai waktu terakhir masih terlihat bercak saat dicek dengan kapas, bukan saat Anda mendapati sudah bersih.</p>'
      : '<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn blood" id="qStartNow" type="button">Darah keluar sekarang</button><button class="btn" id="qStartOther" type="button">Keluar di waktu lain…</button></div>' +
        '<p class="small muted" style="margin:0">Cairan keruh atau kuning dari rahim juga dicatat sebagai darah. Untuk haid yang sudah selesai, pakai <b>Catat haid yang sudah lewat</b>.</p>') +
    '</div>';
  if (R.late) h += '<div class="banner" style="margin:0"><p>Menurut adat, haid seharusnya mulai ' + esc(fmtDT(R.forecast[0].start)) + ', tetapi belum ada darah yang dicatat.</p></div>';

  // yang berlaku
  h += '<div class="card"><h3>Yang berlaku sekarang</h3><ul class="rules">' + RULES[st.t].map(r => '<li>' + esc(r) + '</li>').join('') + '</ul></div>';

  // tindakan dekat
  const near = R.allEvents.filter(e => e.time >= now - 3 * D && e.time <= now + 16 * D);
  if (near.length) {
    h += '<div class="card"><h3>Mandi dan shalat</h3><div class="todo">' + near.map(e =>
      '<div class="row"><span class="pill" data-t="' + (e.kind === 'mandi' ? 'mandi' : 'shalat') + '">' + (e.kind === 'mandi' ? 'Mandi' : e.kind === 'qadha' ? 'Qadha' : e.kind === 'shalat' ? 'Shalat' : 'Info') + '</span>' +
      '<div><div class="when">' + (e.time > now ? 'Nanti · ' : '') + esc(fmtDT(e.time)) + '</div><div class="small">' + esc(e.text) + '</div></div></div>').join('') + '</div></div>';
  }

  // adat
  const a = R.adat;
  const cyc = a.haid && a.suci ? a.haid.value + a.suci.value : null;
  h += '<div class="card"><h3>Adat (kebiasaan) terakhir</h3><div class="kv">' +
    '<div><span class="small muted">Adat haid</span><b>' + (a.haid ? esc(fmtDur(a.haid.value)) : '—') + '</b>' + (a.haid && a.haid.pattern ? '<span class="small muted">urutan ' + a.haid.pattern.map(v => Math.round(v / D * 10) / 10).join('-') + ' hari</span>' : '') + '</div>' +
    '<div><span class="small muted">Adat suci</span><b>' + (a.suci ? esc(fmtDur(a.suci.value)) : '—') + '</b>' + (a.suci && a.suci.pattern ? '<span class="small muted">urutan ' + a.suci.pattern.map(v => Math.round(v / D * 10) / 10).join('-') + ' hari</span>' : '') + '</div>' +
    '<div><span class="small muted">Siklus</span><b>' + (cyc ? esc(fmtDur(cyc)) : '—') + '</b></div>' +
    (function () { const nx = R.forecast.find(p => p.start > now); return '<div><span class="small muted">Perkiraan haid berikutnya</span><b>' + (nx ? esc(fmtDate(nx.start)) : '—') + '</b>' + (nx ? '<span class="small muted">' + esc(fmtTime(nx.start)) + ' · ' + Math.ceil((nx.start - now) / D) + ' hari lagi</span>' : '') + '</div>'; })() +
    '</div><p class="small muted" style="margin:0">Adat inilah yang dipakai bila suatu saat darah keluar lebih dari 15 hari 15 malam (istihadhah).</p></div>';

  h += '<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" id="qAdd" type="button">Catat haid yang sudah lewat</button><button class="btn" id="qBirth" type="button">Catat melahirkan / keguguran</button></div></div>';
  el.innerHTML = h;

  const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
  on('qStartNow', () => {
    if (data.bloods.some(b => b.start > Date.now())) return;
    commit(d => d.bloods.push({ id: uid(), start: Date.now(), end: null }), 'Darah keluar dicatat: ' + fmtDT(Date.now()));
  });
  on('qStartOther', () => openBlood(null, { start: Date.now(), open: true }));
  on('qStopNow', () => {
    const raw = data.bloods.find(b => b.end == null); if (!raw) return;
    commit(() => { raw.end = Date.now(); }, 'Darah berhenti dicatat: ' + fmtDT(Date.now()));
  });
  on('qStopOther', () => openStop(Date.now()));
  on('qBirth', () => openBirth());
  on('qAdd', () => openBlood(null, { past: true }));
}

// Form singkat: darah yang sedang keluar berhenti pada waktu tertentu
function openStop(ms) {
  const raw = data.bloods.find(b => b.end == null);
  if (!raw) return toast('Tidak ada darah yang sedang keluar.');
  openSheet('<h2>Darah berhenti</h2><p class="small muted" style="margin:0">Darah keluar sejak ' + esc(fmtDT(raw.start)) + '.</p>' +
    dtpHtml('st', Math.max(ms, raw.start + MIN), 'Terakhir terlihat bercak') +
    '<p class="err" id="stErr" hidden></p><div class="acts"><button class="btn" id="stCancel" type="button">Batal</button><button class="btn clean" id="stSave" type="button">Simpan</button></div>', sh => {
    bindDtp(sh, 'st');
    sh.querySelector('#stCancel').onclick = closeSheet;
    sh.querySelector('#stSave').onclick = () => {
      const t = getDtp('st'), err = sh.querySelector('#stErr');
      const fail = m => { err.hidden = false; err.textContent = m; };
      if (t == null) return fail('Pilih tanggal dan jam.');
      if (t <= raw.start) return fail('Waktu berhenti harus setelah ' + fmtDT(raw.start) + '.');
      if (t > Date.now() + MIN) return fail('Waktu tidak boleh di masa depan.');
      closeSheet(); commit(() => { raw.end = t; }, 'Darah berhenti dicatat: ' + fmtDT(t));
    };
  });
}

function renderCatatan() {
  const el = document.getElementById('v-catatan');
  const list = [...data.bloods].sort((a, b) => b.start - a.start);
  let h = '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Catatan darah</h2>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary sm" id="cAdd" type="button">+ Darah</button><button class="btn sm" id="cBirth" type="button">+ Melahirkan</button></div></div>' +
    '<p class="small muted" style="margin:0">Satu catatan = satu kali darah keluar sampai berhenti. Bila darah putus lalu keluar lagi, buat catatan baru. Hukumnya dihitung otomatis.</p></div>';
  if (!list.length) h += '<div class="empty">Belum ada catatan. Tekan <b>+ Darah</b> untuk mencatat darah pertama.</div>';
  else h += '<div class="entries">' + list.map(b => {
    const end = b.end == null ? null : b.end;
    return '<div class="entry"><div style="min-width:0"><div class="t">' + esc(fmtDT(b.start)) + '</div><div class="d">' +
      (end == null ? '<span class="pill" data-t="haid">Masih keluar</span> · ' + esc(fmtDur(Date.now() - b.start)) : 'sampai ' + esc(fmtDT(end)) + ' · <span class="num">' + esc(fmtDur(end - b.start)) + '</span>') +
      '</div></div><div class="acts"><button class="btn sm" data-edit="' + esc(b.id) + '" type="button">Ubah</button></div></div>';
  }).join('') + '</div>';
  const births = [...data.births].sort((a, b) => b.time - a.time);

    h += '<div class="card"><h3>Melahirkan / keguguran</h3><div class="entries">' + births.map(b =>
      '<div class="entry"><div><div class="t">' + (b.kind === 'keguguran' ? 'Keguguran' : 'Melahirkan') + '</div><div class="d">' + esc(fmtDT(b.time)) + ' · batas nifas ' + esc(fmtDate(b.time + 60 * D)) + '</div></div>' +

  }
  el.innerHTML = h;
  document.getElementById('cAdd').onclick = () => openBlood();
  document.getElementById('cBirth').onclick = () => openBirth();
  el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => openBlood(data.bloods.find(x => x.id === b.dataset.edit)));
  el.querySelectorAll('[data-bedit]').forEach(b => b.onclick = () => openBirth(data.births.find(x => x.id === b.dataset.bedit)));
}

function piecesIn(a, b) {
  const out = [];
  for (const x of R.timeline) {
    const s = Math.max(a, x.start), e = Math.min(b, x.end);
    if (e > s) out.push({ type: x.type, s, e, x });
  }
  return out;
}

function renderKalender() {
  const el = document.getElementById('v-kalender');
  const now = R.now;
  if (calMonth == null) { const d = new Date(now); calMonth = new Date(d.getFullYear(), d.getMonth(), 1).getTime(); }
  const m = new Date(calMonth);
  const first = new Date(m.getFullYear(), m.getMonth(), 1);
  const offset = (first.getDay() + 6) % 7; // Senin di kiri
  let day = addDays(first.getTime(), -offset);
  const preds = R.forecast.filter(p => p.end > now);
  const predAt = (a, b) => preds.filter(p => p.end > a && p.start < b);
  const evDays = new Set(R.allEvents.filter(e => e.kind === 'mandi').map(e => startOfDay(e.time)));
  let cells = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Ahd'].map(d => '<div class="dow">' + d + '</div>').join('');
  for (let i = 0; i < 42; i++) {
    const d0 = day, d1 = addDays(day, 1);
    const inMonth = new Date(d0).getMonth() === m.getMonth();
    const pcs = piecesIn(d0, d1);
    const span = d1 - d0;
    const pp = d1 > now ? predAt(Math.max(d0, now), d1) : [];
    const bar = pcs.map(p => '<span class="t-' + p.type + '" style="left:' + ((p.s - d0) / span * 100).toFixed(2) + '%;width:' + Math.max(2, (p.e - p.s) / span * 100).toFixed(2) + '%"></span>').join('') +
      pp.map(p => { const s = Math.max(p.start, d0, now), e = Math.min(p.end, d1); return e > s ? '<span class="t-pred" style="left:' + ((s - d0) / span * 100).toFixed(2) + '%;width:' + Math.max(2, (e - s) / span * 100).toFixed(2) + '%"></span>' : ''; }).join('');
    const isPred = pp.length > 0;
    const cls = ['day', inMonth ? '' : 'out', startOfDay(now) === d0 ? 'today' : '', calSel === d0 ? 'sel' : '', isPred ? 'pred' : ''].join(' ');
    cells += '<button class="' + cls + '" data-day="' + d0 + '" type="button" aria-label="' + esc(fmtDate(d0)) + '"><span class="n">' + new Date(d0).getDate() + '</span><div class="bar">' + bar + '</div><div class="marks">' + (evDays.has(d0) ? '<i title="mandi"></i>' : '') + '</div></button>';
    day = d1;
    if (i >= 34 && new Date(day).getMonth() !== m.getMonth() && new Date(day).getDay() === 1) break;
  }
  let h = '<div class="card"><div class="cal-head"><button class="btn sm" id="calPrev" type="button" aria-label="Bulan sebelumnya">‹</button><h2>' + BULAN_P[m.getMonth()] + ' ' + m.getFullYear() + '</h2><button class="btn sm" id="calNext" type="button" aria-label="Bulan berikutnya">›</button></div>' +
    '<div class="cal">' + cells + '</div>' +
    '<div class="legend"><span><i class="t-haid"></i>Haid</span><span><i class="t-nifas"></i>Nifas</span><span><i class="t-istihadhah"></i>Istihadhah</span><span><i class="t-naqa"></i>Bersih di sela haid</span>' + (data.settings.lupaAdat ? '<span><i class="t-mutahayyirah"></i>Mutahayyirah</span>' : '') + '<span><i style="background:var(--accent);width:8px;height:8px;border-radius:50%"></i>Waktu mandi</span><span><i style="border:1px dashed var(--haid)"></i>Perkiraan haid</span></div></div>';
  if (calSel != null) {
    const d0 = calSel, d1 = addDays(d0, 1);
    const pcs = piecesIn(d0, d1);
    const evs = R.allEvents.filter(e => e.time >= d0 && e.time < d1);
    const pt = prayerDay(d0);
    h += '<div class="card"><h2>' + esc(fmtDate(d0)) + '</h2>' +
      '<div class="daybar24">' + pcs.map(p => '<span class="t-' + p.type + '" style="left:' + ((p.s - d0) / D * 100).toFixed(2) + '%;width:' + Math.max(.5, (p.e - p.s) / D * 100).toFixed(2) + '%"></span>').join('') + '</div>' +
      '<div class="ticks"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>' +
      (pcs.length ? '<div class="todo">' + pcs.map(p => '<div class="row"><span class="pill" data-t="' + p.type + '">' + LABEL[p.type] + '</span><div class="small"><span class="mono">' + fmtTime(p.s) + '–' + (p.e === d1 ? '24.00' : fmtTime(p.e)) + '</span></div></div>').join('') + '</div>' : '<p class="small muted" style="margin:0">Tidak ada darah tercatat. Hukumnya suci.</p>') +
      (evs.length ? '<div class="todo">' + evs.map(e => '<div class="row"><span class="pill" data-t="mandi">' + (e.kind === 'mandi' ? 'Mandi' : 'Shalat') + '</span><div class="small"><span class="mono">' + fmtTime(e.time) + '</span> · ' + esc(e.text) + '</div></div>').join('') + '</div>' : '') +
      (d1 > now && predAt(Math.max(d0, now), d1).length ? '<p class="small" style="margin:0"><span class="pill" data-t="haid">Perkiraan haid</span> ' + predAt(Math.max(d0, now), d1).map(p => esc(fmtRange(p.start, p.end))).join('; ') + '. Ini hanya perkiraan dari adat; hukumnya ditentukan oleh darah yang benar-benar keluar.</p>' : '') +
      '<p class="small muted" style="margin:0">Jadwal shalat (' + esc(data.settings.city || 'koordinat') + '): Subuh ' + fmtTime(pt.subuh) + ' · Dzuhur ' + fmtTime(pt.dzuhur) + ' · Ashar ' + fmtTime(pt.ashar) + ' · Maghrib ' + fmtTime(pt.maghrib) + ' · Isya ' + fmtTime(pt.isya) + '</p>' +
      dayActions(d0) + '</div>';
  } else {
    h += '<p class="small muted">Ketuk tanggal untuk melihat rincian, atau untuk mencatat darah langsung di tanggal itu.</p>';
  }
  h += predListHtml();
  el.innerHTML = h;
  document.getElementById('calPrev').onclick = () => { const d = new Date(calMonth); calMonth = new Date(d.getFullYear(), d.getMonth() - 1, 1).getTime(); renderKalender(); };
  document.getElementById('calNext').onclick = () => { const d = new Date(calMonth); calMonth = new Date(d.getFullYear(), d.getMonth() + 1, 1).getTime(); renderKalender(); };
  el.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { calSel = +b.dataset.day; renderKalender(); const det = el.querySelector('.card:nth-child(2)'); if (det && det.scrollIntoView) det.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
  bindDayActions(el);
}

// Tombol pencatatan langsung dari tanggal kalender
function dayActions(d0) {
  const now = Date.now();
  if (d0 > now) return '<p class="small muted" style="margin:0">Tanggal ini belum terjadi, jadi belum bisa dicatat.</p>';
  const open = data.bloods.find(b => b.end == null);
  const d1 = addDays(d0, 1);
  const recs = data.bloods.filter(b => b.start < d1 && (b.end == null ? now : b.end) > d0);
  let h = '<div class="day-acts">';
  if (open && d1 > open.start) h += '<button class="btn clean sm" type="button" data-act="stop" data-d="' + d0 + '">Darah berhenti di tanggal ini</button>';
  if (!open || d0 < open.start) h += '<button class="btn blood sm" type="button" data-act="start" data-d="' + d0 + '">Darah mulai di tanggal ini</button>';
  recs.forEach(r => { h += '<button class="btn sm" type="button" data-act="edit" data-id="' + esc(r.id) + '">Ubah catatan ' + esc(fmtDate(r.start, false)) + '</button>'; });
  return h + '</div>';
}
function bindDayActions(root) {
  root.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
    const d = +b.dataset.d;
    if (b.dataset.act === 'start') openBlood(null, { start: Math.min(Date.now(), d + 8 * H) });
    else if (b.dataset.act === 'stop') openStop(Math.min(Date.now(), d + 8 * H));
    else if (b.dataset.act === 'edit') openBlood(data.bloods.find(x => x.id === b.dataset.id));
  });
}

function predListHtml() {
  const now = Date.now();
  const preds = R.forecast.filter(p => p.end > now).slice(0, 4);
  let h = '<div class="card"><h3>Prediksi haid berikutnya</h3>';
  if (!R.forecast.length) return h + '<p class="small muted" style="margin:0">Prediksi muncul setelah satu haid tercatat.</p></div>';
  const rough = R.forecast[0].rough;
  if (R.late) h += '<p class="small" style="margin:0;color:var(--warn)">Menurut adat, haid seharusnya mulai ' + esc(fmtDT(R.forecast[0].start)) + ', tetapi belum ada darah yang dicatat. Bila darah sudah keluar, catat sekarang.</p>';
  h += '<div class="pred-list">' + preds.map((p, i) => '<div class="pred-item"><span><b>' + esc(fmtDate(p.start)) + '</b> <span class="muted small">' + esc(fmtTime(p.start)) + '</span></span><span class="small muted">sampai ' + esc(fmtDate(p.end, false)) + ' · ' + esc(fmtDur(p.haid)) + '</span></div>').join('') + '</div>' +
    '<p class="small muted" style="margin:0">' + (rough

      : 'Dihitung dari adat haid dan suci terakhir' + (R.adat.haid && R.adat.haid.pattern || R.adat.suci && R.adat.suci.pattern ? ', mengikuti urutan adat yang berulang' : '') + '.') +

}

function renderHukum() {
  const el = document.getElementById('v-hukum');
  const items = [];
  for (const x of R.timeline) items.push({ time: x.start, seg: x });
  for (const e of R.allEvents) if (e.time <= R.now + 16 * D) items.push({ time: e.time, ev: e });
  items.sort((a, b) => b.time - a.time || (a.ev ? -1 : 1));
  const f = lawFilter;
  const filt = items.filter(i => f === 'semua' || (f === 'haid' && i.seg && (i.seg.type === 'haid' || i.seg.type === 'nifas' || i.seg.type === 'naqa' || i.seg.type === 'mutahayyirah')) || (f === 'ist' && i.seg && i.seg.type === 'istihadhah') || (f === 'ibadah' && i.ev));
  let h = '<div class="card"><h2>Riwayat hukum</h2><p class="small muted" style="margin:0">Setiap keputusan disertai alasan dan rujukannya. Hasil ini dihitung ulang setiap kali catatan berubah.</p>' +
    '<div class="chips">' + [['semua', 'Semua'], ['haid', 'Haid & nifas'], ['ist', 'Istihadhah'], ['ibadah', 'Mandi & shalat']].map(([k, l]) => '<button class="chip" type="button" data-f="' + k + '" aria-pressed="' + (f === k) + '">' + l + '</button>').join('') + '</div></div>';
  if (!filt.length) h += '<div class="empty">Belum ada yang bisa ditampilkan.</div>';
  else h += '<div class="card law">' + filt.slice(0, 200).map(i => {
    if (i.seg) {
      const s = i.seg;
      return '<div class="law-item"><span class="dot t-' + s.type + '"></span><div class="body"><div class="head"><span class="pill" data-t="' + s.type + '">' + (s.type === 'naqa' ? 'Bersih di sela ' + (s.parent || 'haid') : LABEL[s.type]) + '</span>' + (s.provisional ? '<span class="pill prov">Sementara</span>' : '') + '<span class="small muted num">' + esc(fmtDur(s.end - s.start)) + '</span></div>' +
        '<div class="range">' + esc(fmtRange(s.start, s.end)) + '</div><p class="small">' + esc(s.reason || '') + '</p>' + refHtml(s.ref) + '</div></div>';
    }
    const e = i.ev;
    return '<div class="law-item"><span class="dot ev"></span><div class="body"><div class="head"><span class="pill" data-t="mandi">' + (e.kind === 'mandi' ? 'Mandi' : e.kind === 'qadha' ? 'Qadha' : e.kind === 'shalat' ? 'Shalat' : 'Info') + '</span>' + (e.time > R.now ? '<span class="pill prov">Nanti</span>' : '') + '</div><div class="range">' + esc(fmtDT(e.time)) + '</div><p class="small">' + esc(e.text) + '</p>' + refHtml(e.ref) + '</div></div>';
  }).join('') + '</div>';
  el.innerHTML = h;
  el.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { lawFilter = b.dataset.f; renderHukum(); });
}

function openSheet(html, bind) {
  const wrap = document.getElementById('sheetWrap'), sh = document.getElementById('sheet');
  sh.innerHTML = html; wrap.hidden = false; bind(sh);
  const first = sh.querySelector('input, select, button'); if (first) first.focus();

function closeSheet() { document.getElementById('sheetWrap').hidden = true; }
document.getElementById('sheetWrap').addEventListener('click', e => { if (e.target.id === 'sheetWrap') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function openBlood(rec, opts) {
  opts = opts || {};
  const isNew = !rec;
  const adatH = R && R.adat.haid ? R.adat.haid.value : 7 * D;
  let start = rec ? rec.start : (opts.start != null ? opts.start : Date.now() - (opts.past ? adatH + 3 * D : 2 * H));
  if (!rec && opts.past) start = startOfDay(start) + 5 * H;
  let end = rec ? rec.end : (opts.open || (opts.start != null && !opts.past && start > Date.now() - 2 * D) ? null : Math.min(Date.now(), start + adatH));
  const openNow = end == null;
  const durs = [3, 4, 5, 6, 7, 8, 10, 15];
  openSheet('<h2>' + (isNew ? 'Catat darah' : 'Ubah catatan darah') + '</h2>' +
    dtpHtml('fs', start, 'Darah mulai keluar') +
    '<label class="check" for="fOpen"><input type="checkbox" id="fOpen"' + (openNow ? ' checked' : '') + '> Darah masih keluar sampai sekarang</label>' +
    '<div id="fEndWrap"' + (openNow ? ' hidden' : '') + ' class="stack" style="gap:10px">' +
    '<div class="field"><span>Lama darah keluar (cepat)</span><div class="chips">' + durs.map(n => '<button type="button" class="chip" data-dur="' + n + '" aria-pressed="false">' + n + ' hari</button>').join('') + '</div></div>' +
    dtpHtml('fe', end || Date.now(), 'Darah berhenti (terakhir terlihat bercak)') +
    '<p class="small muted" style="margin:0" id="fLen"></p></div>' +
    '<p class="err" id="fErr" hidden></p>' +
    '<div class="acts">' + (isNew ? '' : '<button class="btn danger" id="fDel" type="button">Hapus</button>') + '<button class="btn" id="fCancel" type="button">Batal</button><button class="btn primary" id="fSave" type="button">Simpan</button></div>', sh => {
    const op = sh.querySelector('#fOpen');
    const showLen = () => { const s = getDtp('fs'), e = getDtp('fe'); sh.querySelector('#fLen').textContent = s != null && e != null && e > s ? 'Lama darah: ' + fmtDur(e - s) : ''; };
    bindDtp(sh, 'fs', showLen); bindDtp(sh, 'fe', () => { sh.querySelectorAll('[data-dur]').forEach(b => b.setAttribute('aria-pressed', 'false')); showLen(); });
    sh.querySelectorAll('[data-dur]').forEach(b => b.onclick = () => {
      const s = getDtp('fs'); if (s == null) return;
      setDtp('fe', Math.min(Date.now(), s + (+b.dataset.dur) * D));
      sh.querySelectorAll('[data-dur]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); showLen();
    });
    showLen();
    op.onchange = () => { sh.querySelector('#fEndWrap').hidden = op.checked; };
    sh.querySelector('#fCancel').onclick = closeSheet;
    const del = sh.querySelector('#fDel');
    if (del) del.onclick = () => {
      if (del.dataset.confirm) { closeSheet(); commit(d => { d.bloods = d.bloods.filter(b => b.id !== rec.id); }, 'Catatan dihapus'); }
      else { del.dataset.confirm = '1'; del.textContent = 'Tekan lagi untuk menghapus'; }
    };
    sh.querySelector('#fSave').onclick = () => {
      const err = sh.querySelector('#fErr');
      const s = getDtp('fs');
      const e = op.checked ? null : getDtp('fe');
      const fail = m => { err.hidden = false; err.textContent = m; };
      if (s == null) return fail('Isi waktu darah mulai keluar.');
      if (s > Date.now() + MIN) return fail('Waktu mulai tidak boleh di masa depan.');
      if (!op.checked && e == null) return fail('Isi waktu darah berhenti, atau centang "Darah masih keluar".');
      if (e != null && e <= s) return fail('Waktu berhenti harus setelah waktu mulai.');
      if (e != null && e > Date.now() + MIN) return fail('Waktu berhenti tidak boleh di masa depan.');
      const others = data.bloods.filter(b => !rec || b.id !== rec.id);
      if (op.checked && others.some(b => b.end == null)) return fail('Sudah ada catatan darah yang masih keluar. Isi dulu waktu berhentinya.');
      if (op.checked && others.some(b => b.start > s)) return fail('Ada catatan lain setelah waktu ini, jadi darah ini tidak mungkin masih keluar. Isi waktu berhentinya.');
      const ee = e == null ? Date.now() : e;
      const clash = others.find(b => s < (b.end == null ? Date.now() : b.end) && ee > b.start);
      if (clash) return fail('Bertumpuk dengan catatan ' + fmtRange(clash.start, clash.end == null ? Date.now() : clash.end) + '. Ubah salah satunya.');
      closeSheet();
      commit(d => {
        if (rec) { const r = d.bloods.find(b => b.id === rec.id) || rec; r.start = s; r.end = e; if (!d.bloods.includes(r)) d.bloods.push(r); }
        else d.bloods.push({ id: uid(), start: s, end: e });
      }, isNew ? 'Catatan ditambahkan' : 'Catatan diperbarui');
    };
  });
}

function openBirth(rec) {
  const isNew = !rec;
  openSheet('<h2>' + (isNew ? 'Catat melahirkan / keguguran' : 'Ubah catatan melahirkan') + '</h2>' +
    '<label class="field" for="bKind"><span>Jenis</span><select id="bKind"><option value="lahir"' + (rec && rec.kind === 'keguguran' ? '' : ' selected') + '>Melahirkan (termasuk cesar)</option><option value="keguguran"' + (rec && rec.kind === 'keguguran' ? ' selected' : '') + '>Keguguran (alaqah / mudghah)</option></select></label>' +
    '<label class="field" for="bTime"><span>Waktu janin keluar seluruhnya</span><input type="datetime-local" id="bTime" value="' + toInput(rec ? rec.time : Date.now()) + '"></label>' +
    '<p class="small muted" style="margin:0">Hitungan 60 hari nifas dimulai dari waktu ini, sedangkan yang dihukumi nifas dimulai sejak darah keluar. Catat darahnya di menu Catatan.</p>' +
    '<p class="err" id="bErr2" hidden></p>' +
    '<div class="acts">' + (isNew ? '' : '<button class="btn danger" id="bDel" type="button">Hapus</button>') + '<button class="btn" id="bCancel" type="button">Batal</button><button class="btn primary" id="bSave" type="button">Simpan</button></div>', sh => {
    sh.querySelector('#bCancel').onclick = closeSheet;
    const del = sh.querySelector('#bDel');
    if (del) del.onclick = () => {
      if (del.dataset.confirm) { closeSheet(); commit(d => { d.births = d.births.filter(b => b.id !== rec.id); }, 'Catatan dihapus'); }
      else { del.dataset.confirm = '1'; del.textContent = 'Tekan lagi untuk menghapus'; }
    };
    sh.querySelector('#bSave').onclick = () => {
      const t = fromInput(sh.querySelector('#bTime').value), kind = sh.querySelector('#bKind').value;
      const err = sh.querySelector('#bErr2');
      if (t == null || t > Date.now() + MIN) { err.hidden = false; err.textContent = 'Isi waktu yang sudah lewat.'; return; }
      closeSheet();
      commit(d => { if (rec) { const r = d.births.find(b => b.id === rec.id); if (r) { r.time = t; r.kind = kind; } } else d.births.push({ id: uid(), time: t, kind }); }, 'Tersimpan');
    };
  });
}

// ---------------- Navigasi ----------------
function show(v) {
  if (!VIEWS.includes(v)) v = 'hariini';
  view = v;
  VIEWS.forEach(k => { document.getElementById('v-' + k).hidden = k !== v; });
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.v === v)));
  if (location.hash.slice(1) !== v) { try { history.replaceState(null, '', '#' + v); } catch (e) { /* abaikan */ } }
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => show(t.dataset.v));
window.addEventListener('hashchange', () => show(location.hash.slice(1)));
document.getElementById('demoClear').onclick = () => { demo = false; data = { bloods: [], births: [], settings: data.settings }; document.getElementById('demoBanner').hidden = true; queueWrite(); render(); show('hariini'); toast('Contoh dihapus. Silakan mulai mencatat.'); };

let toastT = null;
function toast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2600); }

setInterval(() => { if (document.getElementById('sheetWrap').hidden && !document.activeElement.matches('input, select, textarea')) render(); }, 60000);

show(location.hash.slice(1) || 'hariini');
// tampilkan sesuatu segera (salinan lokal / contoh), lalu sambungkan ke akun
const cached = lsGet();
if (cached) { data = normalize(cached); }
if (isEmpty(data) && !cached) loadDemo();
document.getElementById('demoBanner').hidden = !demo;
render();
initStore();
})();
</script>
